<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otafax-trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0c11; /* Dark background from the new style */
            color: #d1d5db;
        }
        .text-gradient {
            background-image: linear-gradient(135deg, #6b43ff, #8a2be2); /* New gradient colors */
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-card-gradient-1 {
            background-image: linear-gradient(to right, #1a2a6b, #001242); /* New gradient colors */
        }
        .bg-card-gradient-2 {
            background-image: linear-gradient(135deg, #3498DB, #2980B9);
        }
        .bg-coupon-gradient {
            background-image: linear-gradient(to right, #6b43ff, #8a2be2); /* New gradient colors */
        }
        .box-shadow {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .bg-gray-800 {
            background-color: #1a1a2b; /* New color from the new style */
        }
        .rounded-2xl {
            border-radius: 1.5rem; /* Match the new design's rounded corners */
        }
        .border-b {
            border-color: #4b5563; /* New border color */
        }
    </style>
</head>
<body class="bg-[#12141F] text-gray-200 flex flex-col min-h-screen">

    <!-- Main Container -->
    <div class="max-w-md mx-auto flex-1 flex flex-col w-full">

        <!-- Header -->
        <header class="bg-gray-800 text-center py-4 px-6 fixed top-0 w-full z-50 shadow-lg">
            <h1 class="text-xl font-bold text-violet-400">Otafax-trading</h1>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 mt-16 pb-20">
            <div class="p-4 space-y-4">

                <!-- Hero Image & Indicators -->
                <div class="relative w-full h-48 rounded-2xl overflow-hidden shadow-lg box-shadow">
                    <img src="https://placehold.co/600x400/1a1a2b/d1d5db?text=Otafax-trading" alt="Trading platform" class="w-full h-full object-cover">
                    <div class="absolute bottom-4 left-0 right-0 flex justify-center space-x-2">
                        <span class="w-2 h-2 rounded-full bg-white opacity-50"></span>
                        <span class="w-2 h-2 rounded-full bg-white"></span>
                        <span class="w-2 h-2 rounded-full bg-white opacity-50"></span>
                        <span class="w-2 h-2 rounded-full bg-white opacity-50"></span>
                    </div>
                </div>

                <!-- Quick Action Buttons -->
                <div class="grid grid-cols-4 gap-4 text-center mt-6 p-4 rounded-2xl bg-gray-800 shadow-lg">
                    <div class="flex flex-col items-center">
                        <div class="w-14 h-14 rounded-full flex items-center justify-center mb-2 bg-card-gradient-1 box-shadow">
                            <i class="fa-solid fa-arrow-up text-xl text-emerald-400"></i>
                        </div>
                        <span class="text-sm">Recharge</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <div class="w-14 h-14 rounded-full flex items-center justify-center mb-2 bg-card-gradient-1 box-shadow">
                            <i class="fa-solid fa-arrow-down text-xl text-red-400"></i>
                        </div>
                        <span class="text-sm">Withdrawal</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <div class="w-14 h-14 rounded-full flex items-center justify-center mb-2 bg-card-gradient-1 box-shadow">
                            <i class="fa-solid fa-headset text-xl text-sky-400"></i>
                        </div>
                        <span class="text-sm">Service client</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <div class="w-14 h-14 rounded-full flex items-center justify-center mb-2 bg-card-gradient-1 box-shadow">
                            <i class="fa-solid fa-gift text-xl text-purple-400"></i>
                        </div>
                        <span class="text-sm">Login Bonus</span>
                    </div>
                </div>

                <!-- Gift Codes Card -->
                <div class="bg-gray-800 p-4 rounded-2xl shadow-lg box-shadow">
                    <div class="flex items-center space-x-4">
                        <div class="bg-violet-600 p-3 rounded-full">
                            <i class="fa-solid fa-tag text-white text-xl"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm text-gray-400">Enter Gift Codes</p>
                            <input type="text" placeholder="Please enter your gift code" class="w-full bg-transparent border-b border-gray-600 focus:outline-none focus:border-blue-400 py-1 text-sm">
                        </div>
                        <button class="bg-violet-600 hover:bg-violet-700 text-white font-medium py-2 px-4 rounded-full transition-colors duration-200">
                            Receive
                        </button>
                    </div>
                </div>

                <!-- Discount Coupons Card -->
                <div class="bg-coupon-gradient p-5 rounded-2xl shadow-lg box-shadow flex items-center justify-between text-white">
                    <div>
                        <h2 class="text-xl font-semibold text-gray-100">Discount Coupons</h2>
                        <p class="text-xs text-gray-200 mt-1">
                            You can get discount coupons every time you invest in a product and invest in multiple products to increase your daily income.
                        </p>
                    </div>
                    <button class="bg-white bg-opacity-20 backdrop-filter backdrop-blur-sm text-white px-4 py-2 rounded-xl text-sm font-medium">
                        Discount coupons
                    </button>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="fixed bottom-0 left-0 right-0 bg-gray-900 py-4 px-2 shadow-lg z-50 rounded-t-3xl border-t border-gray-700">
            <ul class="flex justify-around items-center">
                <li class="flex flex-col items-center text-sm text-violet-400">
                    <i class="fa-solid fa-house-chimney text-xl"></i>
                    <span>Home</span>
                </li>
                <li class="flex flex-col items-center text-sm text-gray-500">
                    <i class="fa-solid fa-toolbox text-xl"></i>
                    <span>Equipment</span>
                </li>
                <li class="flex flex-col items-center -mt-10">
                    <div class="w-16 h-16 rounded-full bg-violet-600 flex items-center justify-center shadow-lg box-shadow">
                        <i class="fa-solid fa-plus text-2xl text-white"></i>
                    </div>
                </li>
                <li class="flex flex-col items-center text-sm text-gray-500">
                    <i class="fa-solid fa-users text-xl"></i>
                    <span>Team</span>
                </li>
                <li class="flex flex-col items-center text-sm text-gray-500">
                    <i class="fa-solid fa-user text-xl"></i>
                    <span>Mine</span>
                </li>
            </ul>
        </nav>

        <!-- Custom Modal for Alerts -->
        <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-[100]">
            <div class="bg-gray-800 p-6 rounded-xl shadow-lg w-full max-w-sm">
                <h3 class="text-lg font-bold text-white mb-2" id="modal-title"></h3>
                <p class="text-gray-300" id="modal-message"></p>
                <div class="flex justify-end mt-4">
                    <button id="modal-close" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg">
                        OK
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Custom message box logic
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalCloseBtn = document.getElementById('modal-close');

        function showMessage(title, message) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modal.classList.remove('hidden');
        }

        modalCloseBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
        });

        // Add event listeners to buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', (e) => {
                const buttonText = e.target.closest('button').textContent.trim();
                if (buttonText === 'Receive') {
                    const giftCode = document.querySelector('input').value;
                    if (giftCode.trim() === '') {
                        showMessage('Error', 'Please enter a gift code.');
                    } else {
                        showMessage('Success', `Gift code "${giftCode}" received.`);
                    }
                } else if (buttonText.includes('Discount')) {
                    showMessage('Info', 'Navigating to discount coupons.');
                }
            });
        });
    </script>
</body>
</html>
