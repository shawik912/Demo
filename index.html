<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V12 TikTok Ubuntu Fix</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">

    <!-- Main Content Container -->
    <div class="w-full max-w-2xl bg-slate-800 bg-opacity-70 backdrop-blur-sm p-8 md:p-12 rounded-3xl shadow-2xl border border-slate-700 transform transition-all duration-300 hover:scale-105">

        <!-- Header Section -->
        <header class="text-center mb-10">
            <h1 class="text-3xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 mb-2">
                THIS IS V12 TIKTOK UBUNTU FIX
            </h1>
            <p class="text-lg md:text-xl text-slate-300 font-semibold">
                Someone has used his premium feature to fix his account.
            </p>
        </header>

        <!-- Message Section -->
        <section class="text-center mb-10">
            <p class="text-base md:text-lg text-slate-400 leading-relaxed mb-4">
                Please be patient our team is trying hard to fix the API.
            </p>
            <div class="bg-slate-900 px-6 py-3 rounded-xl inline-block shadow-inner border border-slate-700">
                <span class="text-sm text-slate-500 font-medium">Client ID:</span>
                <span class="text-lg md:text-xl font-bold text-slate-200 ml-2">#12567CG</span>
            </div>
        </section>

        <!-- Contact Section -->
        <section class="text-center mb-10">
            <h2 class="text-xl md:text-2xl font-semibold text-slate-200 mb-4">
                Contact Us
            </h2>
            <a href="https://developers.tiktok.com/" target="_blank" rel="noopener noreferrer" class="inline-block px-8 py-3 bg-cyan-600 hover:bg-cyan-700 text-white font-bold rounded-full shadow-lg transition-all duration-300 transform hover:-translate-y-1 hover:shadow-xl">
                Add Contact
            </a>
        </section>

        <!-- Footer -->
        <footer class="text-center text-sm text-slate-500 pt-8 border-t border-slate-700 mt-4">
            <p>SurvivalUg</p>
        </footer>

    </div>

</body>
</html>
