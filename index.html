<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            border-radius: 1rem;
            background-color: #1a1a1a;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .odd-display {
            font-size: 3rem;
            font-weight: 700;
            color: #ff3b3f;
            text-align: center;
            margin: 2rem 0;
            transition: transform 0.3s ease-in-out;
        }
        .odd-display.shaking {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            perspective: 1000px;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .btn-red {
            background-color: #ff3b3f;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-weight: bold;
            text-align: center;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-red:hover {
            background-color: #e63236;
            transform: translateY(-2px);
        }
        .btn-red:active {
            transform: translateY(0);
        }
        .input-group {
            display: none;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .message-box {
            background-color: #333;
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            margin-top: 1.5rem;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="bg-black text-white font-inter flex flex-col items-center justify-center min-h-screen">
    <div class="container flex flex-col items-center">
        <!-- The user's image of the plane -->
        <img id="aviator-image" src="https://placehold.co/300x200/ff3b3f/ffffff?text=Aviator+Plane" alt="Aviator Plane" class="w-full max-w-sm rounded-lg mb-8">
        
        <h1 class="text-2xl font-bold text-center mb-6">Aviator Predictor v4.0</h1>

        <div id="odd-display" class="odd-display">1.00x</div>
        
        <div class="w-full flex flex-col space-y-4">
            <button id="predict-btn" class="btn-red hidden">Get Prediction!</button>
            <button id="activate-btn" class="btn-red">Activate!</button>
        </div>

        <!-- Hidden input section for activation code -->
        <div id="activation-group" class="input-group">
            <input id="code-input" type="text" placeholder="Enter Activation Code" class="p-3 rounded-lg bg-gray-800 text-white placeholder-gray-500 w-full text-center">
            <button id="submit-code-btn" class="btn-red">Submit Code</button>
            <button id="get-code-btn" class="btn-red">Get Code</button>
        </div>

        <!-- Message Box for success/error messages -->
        <div id="message-box" class="message-box opacity-0"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const activateBtn = document.getElementById('activate-btn');
            const predictBtn = document.getElementById('predict-btn');
            const activationGroup = document.getElementById('activation-group');
            const codeInput = document.getElementById('code-input');
            const submitCodeBtn = document.getElementById('submit-code-btn');
            const getCodeBtn = document.getElementById('get-code-btn');
            const oddDisplay = document.getElementById('odd-display');
            const messageBox = document.getElementById('message-box');
            const aviatorImage = document.getElementById('aviator-image');

            const correctCode = '04254195888';
            let isActivated = false;

            // Use the uploaded image, falling back to a placeholder
            aviatorImage.src = '1000149122.jpg';
            aviatorImage.onerror = () => {
                aviatorImage.src = 'https://placehold.co/300x200/ff3b3f/ffffff?text=Aviator+Plane';
            };

            // Event listener for the "Activate!" button
            activateBtn.addEventListener('click', () => {
                if (!isActivated) {
                    // Show the input fields
                    activationGroup.style.display = 'flex';
                    activateBtn.style.display = 'none'; // Hide activate button
                }
            });

            // Event listener for the "Submit Code" button
            submitCodeBtn.addEventListener('click', () => {
                if (codeInput.value === correctCode) {
                    isActivated = true;
                    showMessage('Code added successfully!', 'green');
                    activationGroup.style.display = 'none';
                    predictBtn.classList.remove('hidden');
                } else {
                    showMessage('Incorrect code. Please try again.', 'red');
                }
            });

            // Event listener for the "Get Code" button
            getCodeBtn.addEventListener('click', () => {
                const message = encodeURIComponent("I need an activation code");
                const whatsappLink = `https://wa.me/+256758426754?text=${message}`;
                window.open(whatsappLink, '_blank');
            });

            // Event listener for the "Get Prediction!" button
            predictBtn.addEventListener('click', () => {
                if (isActivated) {
                    // Start the shaking animation
                    oddDisplay.classList.add('shaking');

                    // Generate a random odd, with a bias towards lower numbers
                    const randomVal = Math.random();
                    let odd;
                    if (randomVal < 0.8) { // 80% chance of low odds (< 2.5)
                        odd = Math.random() * 1.5 + 1.0;
                    } else if (randomVal < 0.95) { // 15% chance of medium odds (2.5 - 5.0)
                        odd = Math.random() * 2.5 + 2.5;
                    } else { // 5% chance of higher odds (> 5.0)
                        odd = Math.random() * 5.0 + 5.0;
                    }
                    
                    // Format the odd to two decimal places and display
                    setTimeout(() => {
                        oddDisplay.textContent = odd.toFixed(2) + 'x';
                        // Remove the shaking animation after a short delay
                        oddDisplay.classList.remove('shaking');
                    }, 1000); // 1-second delay for a sense of "prediction"
                } else {
                    showMessage('Please activate with a code first.', 'red');
                }
            });

            // Function to display a temporary message
            function showMessage(msg, color) {
                messageBox.textContent = msg;
                messageBox.style.backgroundColor = color === 'green' ? '#4CAF50' : '#F44336';
                messageBox.style.opacity = '1';
                // Hide the message after 3 seconds
                setTimeout(() => {
                    messageBox.style.opacity = '0';
                }, 3000);
            }
        });
    </script>
</body>
</html>
