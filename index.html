<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 
      This viewport tag is crucial for responsiveness and prevents zooming on mobile,
      making it feel more like a dedicated app.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>A Prayer for Nobuko</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 
      Google Fonts:
      - 'Lora': A beautiful, elegant serif font for the prayer text.
      - 'Dancing Script': A lovely script font for the title.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* Using 'Lora' as the default font for the letter */
            font-family: 'Lora', serif;
            /* A very soft, warm background color for the whole page */
            background-color: #fdfaf6;
        }

        .letter-title {
            /* Using 'Dancing Script' for the special title */
            font-family: 'Dancing Script', cursive;
        }

        /* This CSS rule is crucial for making the \n (newline)
          characters from the JavaScript string render as line breaks.
        */
        #prayer-text {
            white-space: pre-wrap;
            /* Setting the line height for better readability */
            line-height: 1.75;
        }

        /* Blinking cursor animation */
        .blink {
            animation: blink-animation 1s steps(2, start) infinite;
            /* Matching the cursor color to the text */
            color: #4b5563; 
        }

        @keyframes blink-animation {
            to {
                visibility: hidden;
            }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- 
      The main "Prayer Letter" container.
      - 'w-full max-w-xl': Responsive width, fills mobile screens, maxes out at XL on desktop.
      - 'bg-white': Clean white "stationery" background.
      - 'rounded-lg shadow-2xl': Soft corners and a deep shadow for a premium feel.
      - 'border-t-4 border-orange-300': A warm, loving accent color at the top.
    -->
    <main class="w-full max-w-xl bg-white rounded-lg shadow-2xl overflow-hidden border-t-4 border-orange-300">
        
        <div class="p-6 md:p-10">
            <!-- Header: Title and a small heart icon -->
            <header class="text-center mb-8">
                <h1 class="letter-title text-4xl text-orange-600">
                    A Prayer for Nobuko
                </h1>
                <div class="text-orange-400 mt-2">
                    <!-- Simple, elegant heart icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 inline-block" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
                    </svg>
                </div>
            </header>

            <!-- 
              The main body of the letter.
              The text will be "typed" into the #prayer-text span.
            -->
            <div class="text-gray-700 text-lg">
                <span id="prayer-text"></span>
                <!-- The blinking cursor -->
                <span id="cursor" class="blink relative top-0.5 text-2xl">|</span>
            </div>

            <!-- 
              Footer section inside the letter for the timestamp and location.
              This will appear *after* the typing is complete.
            -->
            <footer id="letter-footer" class="text-right text-sm text-gray-400 mt-8 pt-4 border-t border-gray-100" style="display: none;">
                <p>Kampala, Uganda</p>
                <p>Friday, 3:28 AM (EAT)</p>
            </footer>
        </div>

    </main>

    <script>
        // The full text of the prayer.
        // Using backticks (`) allows us to have line breaks.
        const prayerText = `Dear Lord,

I lift up Nobuko into Your loving hands. Thank You for her kind heart, her light, and the joy she brings into the lives of others. Lord, please cover her, her family, and her friends with Your divine protection. Let no harm come near them. Surround them with peace, joy, and unshakable love.

May Nobuko's smile never fade. May her days be filled with laughter, purpose, and comfort. Shield her from the pain caused by people with heavy hearts or unkind intentions. Let her soul stay gentle and bright, just the way You made it.

Bless her home, her dreams, and every step she takes. Let her feel Your presence even when she feels alone. May she always know she is deeply loved, and that she matters.

And Lord, I humbly pray for more life—for strength, for time to keep loving the beautiful souls You’ve placed in my journey. Thank You for connecting me with such an angel.

Amen. 🙏🏽🧡`;

        // We use the spread operator [...] to turn the string into an array.
        // This correctly handles multi-byte characters like emojis (🙏🏽🧡).
        const textChars = [...prayerText];
        let i = 0;
        const speed = 60; // Milliseconds per character. (Slightly slower for a more deliberate, letter-writing feel)
        
        // Get the HTML elements we need to interact with
        const textElement = document.getElementById('prayer-text');
        const cursorElement = document.getElementById('cursor');
        const footerElement = document.getElementById('letter-footer');

        // This function "types" the prayer
        function typePrayer() {
            if (i < textChars.length) {
                // Add the next character to the span
                textElement.textContent += textChars[i];
                i++;
                
                // Call this function again after 'speed' milliseconds
                setTimeout(typePrayer, speed);
            } else {
                // Typing is finished
                cursorElement.style.display = 'none'; // Hide the cursor
                
                // Fade in the footer with the timestamp and location
                footerElement.style.display = 'block';
                footerElement.style.opacity = '0';
                let opacity = 0;
                const fadeIn = setInterval(() => {
                    if (opacity >= 1) {
                        clearInterval(fadeIn);
                    }
                    opacity += 0.1;
                    footerElement.style.opacity = opacity;
                }, 50);
            }
        }
        
        // Wait for the page to be fully loaded
        window.addEventListener('load', () => {
            // Start the typing animation after a short delay (1 second)
            setTimeout(typePrayer, 1000);
        });
    </script>

</body>
</html>
