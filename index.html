<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Audio Interface</title>
    <!-- Use a sci-fi inspired font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS from CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0b0c10;
            color: #66fcf1;
        }

        .scifi-container {
            position: relative;
            background: rgba(19, 23, 29, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid #45a29e;
            box-shadow: 0 0 20px #45a29e;
            animation: pulse-border 2s infinite alternate;
        }

        .scifi-container::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: linear-gradient(45deg, #66fcf1, #c5c6c7, #45a29e);
            z-index: -1;
            filter: blur(15px);
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        @keyframes pulse-border {
            from { box-shadow: 0 0 10px #45a29e; }
            to { box-shadow: 0 0 25px #45a29e; }
        }

        .audio-wave {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px;
            margin-bottom: 1.5rem;
        }

        .bar {
            width: 4px;
            height: 2px;
            background-color: #66fcf1;
            margin: 0 2px;
            animation: waveform 1.2s infinite ease-in-out;
            border-radius: 2px;
        }

        .bar:nth-child(1) { animation-delay: 0.1s; }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.3s; }
        .bar:nth-child(4) { animation-delay: 0.4s; }
        .bar:nth-child(5) { animation-delay: 0.5s; }
        .bar:nth-child(6) { animation-delay: 0.6s; }

        @keyframes waveform {
            0%, 100% { height: 2px; }
            50% { height: 100%; }
        }

        /* Hide the default audio controls */
        audio {
            display: none;
        }

    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Main sci-fi container -->
    <div class="scifi-container p-8 md:p-12 rounded-3xl max-w-sm w-full text-center">

        <!-- Header -->
        <h1 class="text-4xl md:text-5xl font-bold mb-2 text-white drop-shadow-lg" style="text-shadow: 0 0 10px #66fcf1;">
            <span class="text-red-500">FUCKIN</span> SHIT
        </h1>
        <p class="text-gray-400 mb-6 text-sm md:text-base">System initiated. Audio loop activated.</p>

        <!-- Visual audio wave indicator -->
        <div class="audio-wave">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <!-- Hidden audio element -->
        <audio id="audioPlayer" src="Mutyaba.mp3" loop autoplay muted></audio>
        
        <!-- Interactive un-mute button -->
        <button id="unmuteButton" class="mt-4 px-6 py-3 rounded-full text-white font-bold transition-all duration-300 transform hover:scale-105 active:scale-95" style="background-color: #45a29e; box-shadow: 0 0 15px #45a29e;">
            ACTIVATE SOUND
        </button>

    </div>

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const unmuteButton = document.getElementById('unmuteButton');
        const audioWaveBars = document.querySelectorAll('.audio-wave .bar');

        // Play the audio when the unmute button is clicked
        unmuteButton.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                unmuteButton.textContent = 'SOUND ACTIVE';
                unmuteButton.style.backgroundColor = '#66fcf1';
                unmuteButton.style.boxShadow = '0 0 15px #66fcf1';
                audioWaveBars.forEach(bar => bar.style.animationPlayState = 'running');
            }
            audioPlayer.muted = false;
        });

        // Some browsers will prevent autoplay with sound, so we need to unmute on user interaction.
        // We can check if the audio is paused to control the UI
        audioPlayer.addEventListener('pause', () => {
            unmuteButton.textContent = 'SOUND PAUSED';
            unmuteButton.style.backgroundColor = '#4a5568';
            unmuteButton.style.boxShadow = 'none';
            audioWaveBars.forEach(bar => bar.style.animationPlayState = 'paused');
        });

        audioPlayer.addEventListener('play', () => {
            unmuteButton.textContent = 'SOUND ACTIVE';
            unmuteButton.style.backgroundColor = '#66fcf1';
            unmuteButton.style.boxShadow = '0 0 15px #66fcf1';
            audioWaveBars.forEach(bar => bar.style.animationPlayState = 'running');
        });

        // Set the animation to paused initially
        document.addEventListener('DOMContentLoaded', () => {
            audioWaveBars.forEach(bar => bar.style.animationPlayState = 'paused');
        });
    </script>
</body>
</html>
