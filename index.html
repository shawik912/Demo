<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Note of Deep Appreciation</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS for Enhanced Aesthetics and Animations */

        /* Toast Animation */
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translateY(-100%); }
            10%, 90% { opacity: 1; transform: translateY(0); }
        }
        #toast-message {
            animation: fadeInOut 8s ease-in-out forwards;
            font-family: 'Hiragino Sans', 'Meiryo', 'Noto Sans CJK JP', sans-serif;
            z-index: 1000;
        }

        /* Utility for smooth scrolling in the message container */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #ff99aa; border-radius: 3px; }

        /* 1. Background Motion and Gradient (Warm, Uplifting) */
        @keyframes gentle-float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(8px, 12px) scale(1.005); }
            100% { transform: translate(0, 0) scale(1); }
        }

        #scene-container {
            animation: gentle-float 75s ease-in-out infinite alternate;
            /* Richer, more romantic gradient */
            background: radial-gradient(circle at 70% 30%, #ffedf2 0%, #ffb6c1 50%, #fef3f7 100%);
            min-height: 100vh;
        }

        /* 2. Letter Bounce and Glow (More pronounced) */
        @keyframes subtle-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.02); }
        }

        @keyframes soft-glow {
            0% { text-shadow: 0 0 5px rgba(255, 255, 255, 0.5); }
            50% { text-shadow: 0 0 18px rgba(255, 255, 255, 1), 0 0 25px currentColor; }
            100% { text-shadow: 0 0 5px rgba(255, 255, 255, 0.5); }
        }

        .animated-char-wrapper {
            display: inline-block;
            margin-right: 0.1em;
        }

        .animated-char {
            display: inline-block;
            opacity: 0;
            transition: opacity 0.1s ease-in-out;
            animation: subtle-bounce 1.5s infinite ease-in-out, soft-glow 3s infinite ease-in-out;
            line-height: 1.5;
            font-weight: 800;
            cursor: default;
            /* Ensure the Japanese characters are rendered well */
            font-family: 'Hiragino Sans', 'Meiryo', 'Noto Sans CJK JP', sans-serif;
        }

        .visible {
            opacity: 1;
        }

        /* 3. Floating Elements (Hearts and Sparkles) */
        @keyframes float-up {
            0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(0.8); }
            100% { opacity: 0; transform: translateY(-120vh) rotate(360deg) scale(1.5); }
        }

        .floating-element {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            font-size: clamp(15px, 4vw, 30px); /* Responsive element size */
            animation-iteration-count: 1;
            animation-fill-mode: forwards;
            animation-name: float-up;
            z-index: 10;
        }

        /* 4. Welcome Button Style */
        .welcome-button {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Springy transition */
            box-shadow: 0 10px 20px rgba(255, 99, 143, 0.4);
            letter-spacing: 1px;
        }
        .welcome-button:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 18px 30px rgba(255, 99, 143, 0.6);
        }
        .welcome-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 overflow-hidden bg-pink-50">

    <!-- TOAST MESSAGE -->
    <div id="toast-message" class="fixed top-0 left-0 right-0 text-center bg-red-400 text-white p-4 shadow-2xl">
        <p class="text-lg sm:text-2xl font-bold tracking-wider">
            👋 こんにちは！ 私の最初のプロジェクトへようこそ！
        </p>
        <p class="text-sm sm:text-lg">
            日本語があまり上手ではありませんが、一生懸命に翻訳しました。どうかご理解ください。楽しんでください！
        </p>
    </div>

    <!-- Audio Elements: loop attribute is critical for continuous play -->
    <audio id="mol-audio" src="mol.mp3" loop preload="auto" onplay="console.log('Mol audio started looping.')" onpause="console.log('Mol audio paused.')"></audio>
    <audio id="nobuko-audio" src="nobuko.mp3" loop preload="auto" onplay="console.log('Nobuko audio started looping.')" onpause="console.log('Nobuko audio paused.')"></audio>

    <div id="scene-container" class="relative w-full max-w-5xl min-h-[90vh] flex flex-col items-center justify-center rounded-[3rem] shadow-2xl p-4 sm:p-10 transition-all duration-500 my-4 border-4 border-white">

        <!-- Floating Elements Layer -->
        <div id="float-layer" class="absolute inset-0 overflow-hidden"></div>

        <!-- 1. Welcome Screen (Initial View) -->
        <div id="welcome-screen" class="w-full text-center z-30 transition-opacity duration-700 p-4">
            <h1 class="text-4xl sm:text-6xl font-black text-red-600 mb-8 tracking-wide">
                Welcome!
            </h1>
            <p class="text-xl sm:text-2xl text-gray-700 mb-12 font-semibold max-w-md mx-auto">
                Please select your name to listen to your personalized message and music.
            </p>
            
            <div class="flex flex-col sm:flex-row justify-center space-y-6 sm:space-y-0 sm:space-x-12">
                <button id="mol-button" class="welcome-button bg-pink-500 text-white font-black py-4 px-16 rounded-full text-xl shadow-xl">
                    Mol Mol
                </button>
                <button id="nobuko-button" class="welcome-button bg-indigo-500 text-white font-black py-4 px-16 rounded-full text-xl shadow-xl">
                    Nobuko
                </button>
            </div>
            <p class="text-sm text-gray-500 mt-8">(Clicking enables audio playback.)</p>
        </div>

        <!-- 2. Message Display Area (Hidden) -->
        <div id="message-display" class="w-full text-gray-800 z-20 space-y-4 hidden opacity-0 transition-opacity duration-1000 max-h-[80vh] overflow-y-auto custom-scrollbar p-2 sm:p-4">
            <!-- Animated paragraphs will be injected here -->
        </div>
    </div>

    <script>
        // Global Constants and Setup
        let currentAudio = null;
        let spawnInterval = null;
        const CHAR_DELAY_MS = 70; 
        const SECTION_PAUSE_MS = 2000; 

        // Full Japanese text, structured for animation and conditional display
        const SECTIONS = [
            { text: "親愛なる Mol Mol さん、そして Nobuko さんへ", color: "text-red-600", size: "text-3xl sm:text-4xl md:text-5xl lg:text-6xl text-center mb-6" },
            { text: "心からの感謝をお伝えしたくて、この手紙を書きました。お二人に出会えたことは、私にとって人生の大きな恵みです。まだ直接お会いしたことはありませんが、インターネットを通じて出会ったこのご縁を、とても大切に思っています。お二人の優しさや思いやり、そして温かい言葉は、私の心に光を与えてくれました。", color: "text-pink-600", size: "text-base sm:text-lg md:text-xl" },
            { text: "Mol Mol さん、あなたの落ち着いた優しさと、周りの人を思う姿にいつも励まされています。", color: "text-purple-600", size: "text-base sm:text-lg md:text-xl font-bold", tag: "mol" },
            { text: "Nobuko さん、あなたの明るい笑顔と、思いやりあふれる心に何度も救われました。", color: "text-indigo-600", size: "text-base sm:text-lg md:text-xl font-bold", tag: "nobuko" },
            { text: "お二人はまるで家族のように温かく接してくださり、本当に感謝しています。", color: "text-teal-600", size: "text-base sm:text-lg md:text-xl" },
            { text: "時には人生が苦しく感じることもありますが、お二人の言葉や存在を思い出すだけで元気をもらえます。お二人が示してくれる優しさや思いやりを通して、私は「人の善意」や「本当の友情」が今もこの世界にあることを改めて感じました。", color: "text-cyan-600", size: "text-base sm:text-lg md:text-xl" },
            { text: "神様がこの出会いを与えてくださったことに、心から感謝しています。どうかお二人とご家族がいつまでも健康で幸せに過ごせますように。そして、夢や希望がこれからも叶っていきますように。", color: "text-green-600", size: "text-base sm:text-lg md:text-xl" },
            { text: "お二人のような素晴らしい人に出会えたことを、私は決して当たり前だとは思っていません。これは私の人生の中で、とても特別で貴重な出来事です。お二人のおかげで、人の温かさや思いやりを信じる気持ちを取り戻すことができました。", color: "text-yellow-600", size: "text-base sm:text-lg md:text-xl" },
            { text: "改めて、心からありがとうございます。お二人は本当に素晴らしい人たちです。優しく、誠実で、周りの人を幸せにする力を持っています。お二人の存在が、世界を少しでも明るくしていると感じています。", color: "text-orange-600", size: "text-base sm:text-lg md:text-xl" },
            { text: "どうかこれからも笑顔で、幸せな日々を過ごしてください。遠くからですが、いつも感謝と敬意の気持ちでお二人を思っています。", color: "text-red-500", size: "text-base sm:text-lg md:text-xl" },
            { text: "心からの感謝を込めて", color: "text-pink-700", size: "text-xl sm:text-2xl md:text-3xl mt-8 text-right font-semibold" },
            { text: "[HARMONY]", color: "text-red-900", size: "text-2xl sm:text-3xl md:text-4xl text-right font-black" }
        ];

        const FLOAT_SHAPES = ["❤️", "✨", "🎉", "🌟", "💖", "🌸", "⭐", "😊", "🎀"];

        // DOM Element References
        const welcomeScreen = document.getElementById('welcome-screen');
        const displayContainer = document.getElementById('message-display');
        const floatLayer = document.getElementById('float-layer');
        const molButton = document.getElementById('mol-button');
        const nobukoButton = document.getElementById('nobuko-button');
        const molAudio = document.getElementById('mol-audio');
        const nobukoAudio = document.getElementById('nobuko-audio');

        // --- Audio Logic ---

        /**
         * Stops all currently playing audio.
         */
        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0; // Reset to start
                currentAudio = null;
            }
        }

        /**
         * Starts the music playback for the specified recipient.
         * The HTML 'loop' attribute handles continuous playback.
         * @param {'mol' | 'nobuko'} recipient
         */
        function playBackgroundMusic(recipient) {
            stopAudio();
            if (recipient === 'mol') {
                currentAudio = molAudio;
            } else if (recipient === 'nobuko') {
                currentAudio = nobukoAudio;
            }

            if (currentAudio) {
                currentAudio.volume = 0.6; // Gentle background volume
                currentAudio.currentTime = 0; // Ensure it starts from the beginning
                // Attempt to play, catching the common browser error if interaction wasn't direct enough
                currentAudio.play().catch(e => {
                    console.error("Audio playback interrupted/failed. Please ensure a user interaction initiated the click.", e);
                });
            }
        }


        // --- Animation Logic ---

        const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

        function createFloatingElement() {
            const element = document.createElement('span');
            element.textContent = getRandom(FLOAT_SHAPES);
            element.className = 'floating-element';
            
            const left = Math.random() * 90 + 5;
            element.style.left = `${left}vw`;
            element.style.bottom = '0px';
            
            element.style.animationDuration = `${Math.random() * 10 + 8}s`;
            element.style.animationDelay = `-${Math.random() * 8}s`;
            
            floatLayer.appendChild(element);

            setTimeout(() => { element.style.opacity = '1'; }, 10);
            element.addEventListener('animationend', () => { element.remove(); });
        }

        function createCharElement(char, index, baseColorClass) {
            const charSpan = document.createElement('span');
            charSpan.textContent = char;
            charSpan.className = 'animated-char';
            charSpan.style.animationDelay = `${index * 0.05}s, ${index * 0.05}s`;
            charSpan.classList.add(baseColorClass);
            return charSpan;
        }

        async function animateSection(section, charIndexStart) {
            return new Promise(resolve => {
                const p = document.createElement('p');
                p.className = `${section.size} transition-all duration-700 leading-relaxed p-1 sm:p-2 mb-4`;
                displayContainer.appendChild(p);

                const characters = section.text.split('');
                let charCount = charIndexStart;

                characters.forEach((char) => {
                    // Always use non-breaking space for layout consistency
                    if (char === ' ') {
                        p.appendChild(document.createTextNode('\u00A0'));
                        return;
                    }

                    const charWrapper = document.createElement('span');
                    charWrapper.className = 'animated-char-wrapper';
                    
                    const charElement = createCharElement(char, charCount, section.color);
                    charWrapper.appendChild(charElement);
                    p.appendChild(charWrapper);

                    setTimeout(() => {
                        charElement.classList.add('visible');
                        if (Math.random() < 0.15) { 
                            createFloatingElement();
                        }
                    }, charCount * CHAR_DELAY_MS);
                    
                    charCount++;
                });

                // Calculate total delay for the paragraph to finish + pause
                const totalDelay = (charCount - charIndexStart) * CHAR_DELAY_MS + SECTION_PAUSE_MS;
                setTimeout(() => {
                    resolve(charCount);
                    // Scroll to the bottom to show the newest text
                    displayContainer.scrollTop = displayContainer.scrollHeight;
                }, totalDelay);
            });
        }

        /**
         * Main animation sequence
         * @param {'mol' | 'nobuko'} recipient 
         */
        async function startSequence(recipient) {
            // UI State Transition: Hide welcome, show message
            welcomeScreen.classList.add('opacity-0');
            setTimeout(() => {
                welcomeScreen.classList.add('hidden');
                displayContainer.classList.remove('hidden');
                setTimeout(() => displayContainer.classList.remove('opacity-0'), 700);
            }, 700); // Wait for fade out to complete

            // Start Music
            playBackgroundMusic(recipient);
            
            // Reset Animation
            displayContainer.innerHTML = '';
            floatLayer.innerHTML = '';
            let charIndex = 0;

            // Start Confetti/Sparkle Spawning
            spawnInterval = setInterval(createFloatingElement, 250);

            // Animate sections sequentially
            for (const section of SECTIONS) {
                // Conditional content filter for personalization
                if (section.tag && section.tag !== recipient) {
                    continue;
                }
                charIndex = await animateSection(section, charIndex);
            }

            // Sequence Complete: Stop effects and music after a final pause
            setTimeout(() => {
                clearInterval(spawnInterval);
                stopAudio(); 
                // Final confetti burst
                for (let i = 0; i < 15; i++) {
                    createFloatingElement();
                }
            }, 3000); // Increased final pause duration for completion
        }

        // --- Event Listeners ---

        molButton.addEventListener('click', () => {
            startSequence('mol');
        });

        nobukoButton.addEventListener('click', () => {
            startSequence('nobuko');
        });

    </script>
</body>
</html>
